[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdd-issue-tracker"
version = "0.1.0"
description = "Containerized Issue Tracking Application"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
lint.ignore = ["B008"]